[package]
name = "diffview"
version = "0.3.0"
edition = "2021"
description = "Fast syntax-highlighted terminal diff renderer for LazyGit"
license = "MIT"

[lib]
name = "diffview"
path = "src/lib.rs"

[[bin]]
name = "diffview"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tree-sitter = "0.24"
tree-sitter-highlight = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-json = "0.24"
tree-sitter-css = "0.23"
tree-sitter-html = "0.23"
tree-sitter-bash = "0.23"
tree-sitter-md = "0.3"
terminal_size = "0.4"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
