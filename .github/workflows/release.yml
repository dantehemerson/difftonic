name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - v*

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "::error::Tag v$TAG does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Run tests
        run: cargo test --locked

      - name: Build ARM64
        run: cargo build --locked --release --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --locked --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/difftonic \
            target/x86_64-apple-darwin/release/difftonic \
            -output difftonic

      - name: Prepare archive
        run: |
          chmod +x difftonic
          tar czf difftonic-${{ github.ref_name }}-universal-apple-darwin.tar.gz difftonic README.md LICENSE

      - name: Compute checksum
        run: |
          shasum -a 256 difftonic-${{ github.ref_name }}-universal-apple-darwin.tar.gz \
            > difftonic-${{ github.ref_name }}-universal-apple-darwin.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            difftonic-${{ github.ref_name }}-universal-apple-darwin.tar.gz
            difftonic-${{ github.ref_name }}-universal-apple-darwin.tar.gz.sha256

  update-tap:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ASSET_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/difftonic-${TAG}-universal-apple-darwin.tar.gz"
          EXPECTED_SHA=$(curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${TAG}/difftonic-${TAG}-universal-apple-darwin.tar.gz.sha256" | awk '{print $1}')
          mkdir -p Formula
          cat > Formula/difftonic.rb << FORMULA
          class Difftonic < Formula
            desc "Fast syntax-highlighted terminal diff renderer for LazyGit"
            homepage "https://github.com/dantehemerson/difftonic"
            version "${TAG}"
            license "MIT"

            on_macos do
              url "${ASSET_URL}"
              sha256 "${EXPECTED_SHA}"
            end

            def install
              bin.install "difftonic"
            end

            test do
              (testpath/"test.patch").write <<~PATCH
                diff --git a/a.txt b/b.txt
                --- a/a.txt
                +++ b/b.txt
                @@ -1 +1 @@
                -old
                +new
              PATCH
              output = shell_output("git diff --no-color --no-index a.txt b.txt 2>/dev/null | #{bin}/difftonic --no-line-numbers || true")
              assert_match "+new", output
            end
          end
          FORMULA
          sed -i '' 's/^          //' Formula/difftonic.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/difftonic.rb
          git diff --cached --quiet && exit 0
          git commit -m "difftonic ${{ github.ref_name }}"
          git push
